# Local stack: `mise run compose:up` (DISCORD_TOKEN is read from .env).
x-bot: &bot
  build: .
  image: discord-against-humanity:dev
  # Same constraints as the Kubernetes "restricted" profile.
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  networks: [internal]

services:
  valkey:
    image: valkey/valkey:9@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    command: ["valkey-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10
    volumes:
      - valkey-data:/data
    networks: [internal]

  seed:
    <<: *bot
    command: ["seed"]
    environment:
      VALKEY_HOST: valkey
      CARDS_SOURCE: ${CARDS_SOURCE:-}
    depends_on:
      valkey:
        condition: service_healthy
    restart: "no"

  bot:
    <<: *bot
    command: ["run"]
    environment:
      VALKEY_HOST: valkey
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  internal: {}

volumes:
  valkey-data: {}
