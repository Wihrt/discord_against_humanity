[project]
name = "discord-against-humanity"
version = "0.2.0"
description = "A Cards Against Humanity Discord bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord-py>=2.7.1",
    "valkey>=6.2.0",
]

[project.scripts]
discord-against-humanity = "discord_against_humanity.main:main"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "testcontainers>=4.15.0",
    "ty>=0.0.95",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.6"

# ---------------------------------------------------------------------------
# Ruff — linter & formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # bugbear
    "S",            # bandit
    "SIM",          # simplify
    "ASYNC",        # async pitfalls
    "PT",           # pytest style
    "RUF",          # ruff-specific
]
ignore = [
    "S311",  # `random` is fine for shuffling cards, this is not cryptography
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
# Asserts document invariants guaranteed by the caller (current round exists).
"src/discord_against_humanity/adapters/discord/*" = ["S101"]

# ---------------------------------------------------------------------------
# ty — type checker
# ---------------------------------------------------------------------------
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
possibly-unresolved-reference = "error"

# ---------------------------------------------------------------------------
# import-linter — enforce the hexagonal architecture
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "discord_against_humanity"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
layers = [
    "discord_against_humanity.main",
    "discord_against_humanity.adapters",
    "discord_against_humanity.application",
    "discord_against_humanity.domain",
]
containers = []
exhaustive = false

[[tool.importlinter.contracts]]
name = "Core does not depend on frameworks or infrastructure"
type = "forbidden"
source_modules = [
    "discord_against_humanity.domain",
    "discord_against_humanity.application",
]
forbidden_modules = ["discord", "valkey", "discord_against_humanity.config"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Adapters are independent from each other"
type = "independence"
modules = [
    "discord_against_humanity.adapters.discord",
    "discord_against_humanity.adapters.valkey",
    "discord_against_humanity.adapters.memory",
    "discord_against_humanity.adapters.cah_json",
    "discord_against_humanity.adapters.scheduler",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = ["integration: needs Docker (Testcontainers)"]

[tool.coverage.run]
source = ["discord_against_humanity"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
